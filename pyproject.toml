[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifact-gateway"
version = "0.1.0"
description = "Secure API gateway for AI-generated artifact apps — external proxy, internal API forwarding, and user-isolated database access with JWT-scoped auth tokens."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "OhWise Team", email = "team@ohwise.com"}]
keywords = ["ai", "agents", "gateway", "proxy", "artifact", "jwt", "multi-tenant", "duckdb", "mongodb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "pydantic>=2.0.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.10.0"]
mongo = ["motor>=3.0.0"]
all = ["artifact-gateway[duckdb,mongo]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "coverage>=7.0.0",
    "duckdb>=0.10.0",
    "motor>=3.0.0",
    "mongomock-motor>=0.0.21",
    "hatchling",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/jw-open/artifact-gateway"
Repository = "https://github.com/jw-open/artifact-gateway"
Issues = "https://github.com/jw-open/artifact-gateway/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
